[package]
name = "lazer-exporter"
version = "0.1.0"
description = "Export osu!lazer beatmap sets to .osz files"
authors = ["ATRI1024"]
edition = "2021"

[lib]
name = "lazer_exporter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
realm-db-reader = { git = "https://github.com/Ohdmire/realm-db-reader" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "4", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }

[profile.release]
strip = true
lto = true
